<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singh's Sure Shots</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100vh;
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#0b050d;
    overflow-x:hidden;
}

/* =========================
   MAIN PAGE
========================= */

.page{
    position:relative;
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 17%,
        rgba(255,0,170,.25) 0%,
        rgba(190,0,130,.15) 20%,
        transparent 42%
    ),

    linear-gradient(
        180deg,
        #160715 0%,
        #19071a 45%,
        #09050c 100%
    );
}

/* =========================
   BACKGROUND DOTS
========================= */

.dot{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;

    background:#ff82dd;

    box-shadow:
    0 0 10px #ff32c2,
    0 0 18px rgba(255,0,190,.6);

    opacity:.65;
}

.d1{
    top:15%;
    left:20%;
}

.d2{
    top:15%;
    right:20%;
}

.d3{
    top:31%;
    left:18%;
}

.d4{
    top:31%;
    right:18%;
}

.d5{
    top:49%;
    left:50%;
}

.d6{
    top:68%;
    left:20%;
}

.d7{
    top:68%;
    right:20%;
}

.d8{
    top:83%;
    left:20%;
}

.d9{
    top:83%;
    right:20%;
}

/* =========================
   CONTAINER
========================= */

.container{
    position:relative;
    z-index:2;

    width:100%;
    max-width:850px;

    margin:0 auto;

    padding:35px 25px 45px;

    text-align:center;

    overflow:hidden;
}

/* =========================
   BIG LOGO AREA
========================= */

.logo-area{
    position:relative;

    width:430px;
    height:430px;

    max-width:100%;

    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* OUTER RING */

.logo-area::before{
    content:"";

    position:absolute;

    width:410px;
    height:410px;

    max-width:95vw;
    max-height:95vw;

    border-radius:50%;

    border:2px solid rgba(145,30,220,.65);

    box-shadow:
    0 0 25px rgba(150,0,220,.15),
    inset 0 0 25px rgba(255,0,190,.05);
}

/* PINK RING */

.logo-area::after{
    content:"";

    position:absolute;

    width:345px;
    height:345px;

    max-width:80vw;
    max-height:80vw;

    border-radius:50%;

    border:3px solid #ef38b5;

    box-shadow:
    0 0 12px #ff27b9,
    0 0 30px rgba(255,0,190,.7),
    0 0 70px rgba(255,0,180,.25);
}

/* PURPLE GLOW */

.glow{
    position:absolute;

    width:380px;
    height:380px;

    max-width:88vw;
    max-height:88vw;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,0,190,.32) 0%,
        rgba(190,0,140,.20) 45%,
        transparent 72%
    );

    filter:blur(8px);
}

/* =========================
   INNER BLACK CIRCLE
========================= */

.logo{
    position:relative;
    z-index:5;

    width:265px;
    height:265px;

    max-width:62vw;
    max-height:62vw;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #171717 0%,
        #111 70%,
        #090909 100%
    );

    border:3px solid #e23bad;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 18px rgba(255,0,180,.35),
    0 0 50px rgba(255,0,180,.20);
}

/* SINGH TEXT */

.logo span{
    color:#fff;

    font-size:46px;

    font-weight:900;

    letter-spacing:1px;

    text-shadow:
    0 0 7px #fff,
    0 0 18px rgba(255,255,255,.4);
}

/* =========================
   CHANNEL TITLE
========================= */

h1{
    width:100%;

    margin:0 auto 18px;

    color:#fff;

    font-size:56px;

    line-height:1.1;

    font-weight:900;

    letter-spacing:.5px;

    overflow-wrap:anywhere;

    text-shadow:
    0 2px 12px rgba(255,255,255,.15);
}

/* =========================
   SUBTITLE
========================= */

.subtitle{
    width:100%;

    margin:0 auto 55px;

    color:#c7c0ca;

    font-size:24px;

    line-height:1.5;

    overflow-wrap:anywhere;
}

.subtitle span{
    color:#ff40bd;

    margin:0 10px;
}

/* =========================
   STATS
========================= */

.stats{
    width:100%;

    display:grid;

    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:18px;

    margin-bottom:55px;
}

/* CARD */

.card{
    width:100%;

    min-height:260px;

    border-radius:28px;

    padding:22px 8px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        145deg,
        rgba(255,20,180,.13),
        rgba(70,0,65,.20)
    );

    border:2px solid rgba(255,50,185,.30);

    box-shadow:
    inset 0 0 25px rgba(255,0,170,.04),
    0 0 20px rgba(255,0,180,.04);
}

/* ICON */

.icon{
    height:65px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#ff4fc6;

    font-size:50px;

    margin-bottom:12px;

    text-shadow:
    0 0 10px #ff25b8,
    0 0 24px rgba(255,0,190,.5);
}

.people{
    font-size:46px;
}

.refresh{
    font-size:54px;
}

.check{
    font-size:60px;

    font-weight:bold;
}

/* NUMBER */

.number{
    color:#fff;

    font-size:39px;

    line-height:1.15;

    font-weight:900;

    margin-bottom:10px;
}

/* LABEL */

.label{
    color:#c6c0c8;

    font-size:23px;

    line-height:1.2;
}

/* =========================
   TELEGRAM BUTTON
========================= */

.join-btn{
    width:100%;

    min-height:125px;

    padding:15px 20px;

    border-radius:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    text-decoration:none;

    color:#fff;

    font-size:34px;

    font-weight:900;

    background:
    linear-gradient(
        105deg,
        #198cf5,
        #086be8
    );

    box-shadow:
    0 0 25px rgba(0,120,255,.55),
    0 12px 45px rgba(0,80,255,.25);

    transition:.25s ease;

    margin-bottom:28px;
}

.join-btn:hover{
    transform:translateY(-2px);

    box-shadow:
    0 0 35px rgba(0,140,255,.75),
    0 15px 50px rgba(0,80,255,.35);
}

.telegram{
    margin-right:9px;
}

.arrow{
    margin-left:14px;
}

/* =========================
   OPEN TELEGRAM
========================= */

.open-text{
    width:100%;

    margin-bottom:48px;

    color:#beb8c1;

    font-size:22px;

    line-height:1.5;
}

.open-dot{
    color:#ff40bf;

    font-size:25px;
}

/* =========================
   REDIRECT BOX
========================= */

.redirect{
    width:100%;

    min-height:100px;

    padding:18px 20px;

    border-radius:55px;

    border:2px solid rgba(255,40,180,.30);

    background:rgba(255,255,255,.025);

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#c4bdc7;

    font-size:21px;

    line-height:1.5;
}

.redirect a{
    color:#ff43c2;

    font-weight:900;

    margin-left:7px;

    text-decoration:underline;
}

/* =========================
   TABLET
========================= */

@media(max-width:700px){

    .container{
        width:100%;

        padding:
        20px
        15px
        40px;
    }

    /* LOGO */

    .logo-area{
        width:100%;

        height:350px;

        margin-bottom:15px;
    }

    .logo-area::before{
        width:340px;
        height:340px;
    }

    .logo-area::after{
        width:285px;
        height:285px;
    }

    .glow{
        width:315px;
        height:315px;
    }

    .logo{
        width:220px;
        height:220px;
    }

    .logo span{
        font-size:40px;
    }

    /* TITLE */

    h1{
        width:100%;

        font-size:38px;

        line-height:1.12;

        white-space:normal;

        word-break:normal;

        overflow-wrap:anywhere;

        margin-bottom:15px;
    }

    /* SUBTITLE */

    .subtitle{
        width:100%;

        font-size:18px;

        line-height:1.5;

        white-space:normal;

        margin-bottom:42px;
    }

    .subtitle span{
        margin:0 6px;
    }

    /* CARDS */

    .stats{
        width:100%;

        grid-template-columns:
        repeat(3,minmax(0,1fr));

        gap:8px;

        margin-bottom:42px;
    }

    .card{
        min-height:225px;

        border-radius:22px;

        padding:15px 4px;
    }

    .icon{
        height:50px;

        font-size:39px;

        margin-bottom:8px;
    }

    .people{
        font-size:37px;
    }

    .refresh{
        font-size:43px;
    }

    .check{
        font-size:48px;
    }

    .number{
        font-size:25px;

        margin-bottom:7px;
    }

    .label{
        font-size:16px;
    }

    /* BUTTON */

    .join-btn{
        width:100%;

        min-height:105px;

        padding:12px;

        border-radius:27px;

        font-size:22px;

        line-height:1.3;
    }

    .arrow{
        margin-left:8px;
    }

    /* OPEN */

    .open-text{
        font-size:17px;

        margin-bottom:38px;
    }

    .open-dot{
        font-size:20px;
    }

    /* REDIRECT */

    .redirect{
        min-height:85px;

        border-radius:45px;

        padding:15px;

        font-size:15px;
    }
}

/* =========================
   SMALL MOBILE
========================= */

@media(max-width:400px){

    .container{
        padding-left:12px;
        padding-right:12px;
    }

    .logo-area{
        height:325px;
    }

    .logo-area::before{
        width:305px;
        height:305px;
    }

    .logo-area::after{
        width:255px;
        height:255px;
    }

    .glow{
        width:280px;
        height:280px;
    }

    .logo{
        width:195px;
        height:195px;
    }

    .logo span{
        font-size:35px;
    }

    h1{
        font-size:33px;
    }

    .subtitle{
        font-size:16px;

        margin-bottom:38px;
    }

    .stats{
        gap:6px;
    }

    .card{
        min-height:205px;

        border-radius:20px;
    }

    .number{
        font-size:21px;
    }

    .label{
        font-size:14px;
    }

    .icon{
        font-size:36px;
    }

    .people{
        font-size:34px;
    }

    .refresh{
        font-size:40px;
    }

    .check{
        font-size:44px;
    }

    .join-btn{
        min-height:95px;

        font-size:19px;

        border-radius:24px;
    }

    .open-text{
        font-size:15px;
    }

    .redirect{
        font-size:14px;
    }
}

/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:340px){

    .container{
        padding-left:9px;
        padding-right:9px;
    }

    .logo-area{
        height:300px;
    }

    .logo-area::before{
        width:280px;
        height:280px;
    }

    .logo-area::after{
        width:235px;
        height:235px;
    }

    .glow{
        width:255px;
        height:255px;
    }

    .logo{
        width:180px;
        height:180px;
    }

    .logo span{
        font-size:32px;
    }

    h1{
        font-size:29px;
    }

    .subtitle{
        font-size:14px;
    }

    .card{
        min-height:190px;
    }

    .number{
        font-size:18px;
    }

    .label{
        font-size:12px;
    }

    .join-btn{
        font-size:17px;
    }
}

</style>
</head>
