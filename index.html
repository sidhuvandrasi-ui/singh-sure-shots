<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Singh's Sure Shots</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-width:0;
    overflow-x:hidden;
}

body{
    background:#09040c;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   PAGE
========================= */

.page{
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 10%,
        rgba(255,0,190,.28),
        transparent 35%
    ),
    radial-gradient(
        circle at 15% 65%,
        rgba(150,0,255,.10),
        transparent 30%
    ),
    linear-gradient(
        180deg,
        #180718 0%,
        #170619 45%,
        #08040b 100%
    );
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:520px;

    margin:0 auto;

    padding:25px 16px 45px;

    text-align:center;

    position:relative;
    z-index:2;
}

/* =========================
   NEON LOGO AREA
========================= */

.logo-area{
    width:100%;
    height:315px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:15px;
}

/* OUTER PURPLE RING */

.logo-area::before{
    content:"";

    position:absolute;

    width:295px;
    height:295px;

    border-radius:50%;

    border:2px solid rgba(160,40,240,.65);

    box-shadow:
        0 0 15px rgba(160,0,255,.35),
        0 0 40px rgba(160,0,255,.20),
        inset 0 0 25px rgba(255,0,200,.08);
}

/* INNER PINK RING */

.logo-area::after{
    content:"";

    position:absolute;

    width:245px;
    height:245px;

    border-radius:50%;

    border:3px solid #f03ab8;

    box-shadow:
        0 0 8px #ff2fc0,
        0 0 20px #ff2fc0,
        0 0 45px rgba(255,0,190,.75),
        0 0 85px rgba(255,0,190,.25);
}

/* BIG GLOW */

.glow{
    position:absolute;

    width:285px;
    height:285px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,0,190,.38) 0%,
        rgba(190,0,150,.20) 42%,
        transparent 72%
    );

    filter:blur(10px);

    box-shadow:
        0 0 80px rgba(255,0,180,.3);
}

/* =========================
   INNER BLACK CIRCLE
========================= */

.logo{
    position:relative;

    z-index:5;

    width:190px;
    height:190px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at 50% 45%,
        #1b1b1b 0%,
        #101010 65%,
        #080808 100%
    );

    border:3px solid #e53aae;

    box-shadow:
        0 0 10px #ff35c0,
        0 0 25px rgba(255,0,190,.65),
        0 0 55px rgba(255,0,190,.35),
        inset 0 0 25px rgba(255,0,190,.12);
}

/* SINGH TEXT */

.logo span{
    font-size:38px;

    font-weight:900;

    color:#fff;

    letter-spacing:1px;

    text-shadow:
        0 0 5px #fff,
        0 0 10px #ffb6ed,
        0 0 20px #ff3bc4,
        0 0 35px #ff00b7;
}

/* =========================
   CHANNEL NAME
========================= */

h1{
    width:100%;

    font-size:35px;

    line-height:1.12;

    font-weight:900;

    color:#fff;

    margin-bottom:13px;

    overflow-wrap:anywhere;

    text-shadow:
        0 0 5px rgba(255,255,255,.35),
        0 0 15px rgba(255,0,190,.20);
}

/* =========================
   PREMIUM SIGNALS
========================= */

.subtitle{
    width:100%;

    font-size:17px;

    line-height:1.5;

    color:#d0c8d2;

    margin-bottom:40px;

    text-shadow:
        0 0 8px rgba(255,0,190,.15);
}

.subtitle span{
    color:#ff42c0;

    margin:0 6px;

    text-shadow:
        0 0 8px #ff20b6,
        0 0 16px #ff20b6;
}

/* =========================
   STATS
========================= */

.stats{
    width:100%;

    display:grid;

    grid-template-columns:
    repeat(3,minmax(0,1fr));

    gap:7px;

    margin-bottom:38px;
}

/* CARD */

.card{
    width:100%;

    min-width:0;

    height:210px;

    padding:12px 4px;

    border-radius:21px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        145deg,
        rgba(255,20,180,.15),
        rgba(65,0,65,.22)
    );

    border:1px solid rgba(255,55,190,.38);

    box-shadow:
        0 0 8px rgba(255,0,180,.10),
        0 0 22px rgba(255,0,180,.08),
        inset 0 0 20px rgba(255,0,170,.06);

    backdrop-filter:blur(10px);
}

/* CARD ICON */

.icon{
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#ff50c9;

    font-size:37px;

    margin-bottom:9px;

    text-shadow:
        0 0 5px #ffb0eb,
        0 0 12px #ff25b8,
        0 0 25px #ff00b7;
}

.people{
    font-size:34px;
}

.refresh{
    font-size:42px;
}

.check{
    font-size:47px;
    font-weight:bold;
}

/* CARD NUMBER */

.number{
    font-size:21px;

    font-weight:900;

    line-height:1.15;

    margin-bottom:7px;

    color:#fff;

    text-shadow:
        0 0 7px rgba(255,255,255,.25),
        0 0 15px rgba(255,0,190,.25);
}

/* CARD LABEL */

.label{
    font-size:14px;

    color:#c9c1cb;

    text-shadow:
        0 0 8px rgba(255,0,190,.12);
}

/* =========================
   TELEGRAM BUTTON
========================= */

.join-btn{
    width:100%;

    min-height:100px;

    padding:12px;

    border-radius:27px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    text-decoration:none;

    color:#fff;

    font-size:21px;

    font-weight:900;

    background:
    linear-gradient(
        105deg,
        #198cf5,
        #086be8
    );

    border:1px solid rgba(255,255,255,.20);

    box-shadow:
        0 0 10px rgba(0,140,255,.55),
        0 0 25px rgba(0,120,255,.45),
        0 10px 35px rgba(0,70,255,.25);

    text-shadow:
        0 0 7px rgba(255,255,255,.4);

    margin-bottom:23px;

    transition:.25s ease;
}

.join-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 15px rgba(0,150,255,.75),
        0 0 35px rgba(0,120,255,.55);
}

.telegram{
    margin-right:8px;
}

.arrow{
    margin-left:8px;
}

/* =========================
   OPEN TELEGRAM
========================= */

.open-text{
    width:100%;

    color:#c1bac4;

    font-size:15px;

    line-height:1.5;

    margin-bottom:36px;

    text-shadow:
        0 0 7px rgba(255,0,190,.12);
}

.open-dot{
    color:#ff40bf;

    text-shadow:
        0 0 7px #ff20b6,
        0 0 15px #ff20b6;
}

/* =========================
   REDIRECT BOX
========================= */

.redirect{
    width:100%;

    min-height:84px;

    padding:14px;

    border-radius:44px;

    border:1px solid rgba(255,45,185,.35);

    background:
        rgba(255,255,255,.025);

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:14px;

    line-height:1.5;

    color:#c5bec8;

    box-shadow:
        0 0 12px rgba(255,0,180,.06),
        inset 0 0 15px rgba(255,0,180,.03);
}

.redirect a{
    color:#ff45c4;

    font-weight:900;

    margin-left:6px;

    text-decoration:underline;

    text-shadow:
        0 0 8px #ff20b6,
        0 0 15px rgba(255,0,180,.7);
}

/* =========================
   400+ PHONES
========================= */

@media(min-width:400px){

    .container{
        padding-left:20px;
        padding-right:20px;
    }

    .logo-area{
        height:340px;
    }

    .logo-area::before{
        width:320px;
        height:320px;
    }

    .logo-area::after{
        width:265px;
        height:265px;
    }

    .glow{
        width:305px;
        height:305px;
    }

    .logo{
        width:205px;
        height:205px;
    }

    .logo span{
        font-size:40px;
    }

    h1{
        font-size:38px;
    }

    .subtitle{
        font-size:18px;
    }

    .card{
        height:225px;
    }

    .number{
        font-size:24px;
    }

    .label{
        font-size:16px;
    }

    .join-btn{
        min-height:105px;
        font-size:22px;
    }
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    .container{
        max-width:850px;
        padding:45px 30px 55px;
    }

    .logo-area{
        height:420px;
    }

    .logo-area::before{
        width:400px;
        height:400px;
    }

    .logo-area::after{
        width:335px;
        height:335px;
    }

    .glow{
        width:365px;
        height:365px;
    }

    .logo{
        width:255px;
        height:255px;
    }

    .logo span{
        font-size:50px;
    }

    h1{
        font-size:55px;
    }

    .subtitle{
        font-size:24px;
        margin-bottom:60px;
    }

    .stats{
        gap:18px;
        margin-bottom:60px;
    }

    .card{
        height:260px;
        border-radius:28px;
    }

    .icon{
        font-size:50px;
    }

    .number{
        font-size:38px;
    }

    .label{
        font-size:22px;
    }

    .join-btn{
        min-height:125px;
        font-size:34px;
        border-radius:32px;
    }

    .open-text{
        font-size:21px;
    }

    .redirect{
        min-height:100px;
        font-size:20px;
    }
}

</style>
</head>

    </div>

</div>

</body>
