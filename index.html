<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Singh's Sure Shots</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    width:100%;
    min-width:0;
    overflow-x:hidden;
    background:#0b050d;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.page{
    width:100%;
    min-height:100vh;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 50% 13%,
        rgba(255,0,175,.28),
        transparent 34%
    ),
    linear-gradient(
        180deg,
        #170817 0%,
        #18071a 48%,
        #09050c 100%
    );
}

.container{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:28px 16px 40px;
    text-align:center;
    position:relative;
    z-index:2;
}

/* ================= LOGO ================= */

.logo-area{
    width:100%;
    height:310px;
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:15px;
}

.logo-area:before{
    content:"";
    position:absolute;

    width:290px;
    height:290px;

    border-radius:50%;

    border:2px solid rgba(165,35,220,.6);

    box-shadow:
    0 0 30px rgba(180,0,220,.18),
    inset 0 0 30px rgba(255,0,180,.08);
}

.logo-area:after{
    content:"";
    position:absolute;

    width:240px;
    height:240px;

    border-radius:50%;

    border:3px solid #ed39b5;

    box-shadow:
    0 0 14px #ff2cbd,
    0 0 35px rgba(255,0,190,.65),
    0 0 70px rgba(255,0,180,.22);
}

.glow{
    position:absolute;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,0,190,.32),
        rgba(190,0,140,.16) 45%,
        transparent 70%
    );

    filter:blur(8px);
}

.logo{
    position:relative;
    z-index:5;

    width:185px;
    height:185px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #181818,
        #0b0b0b
    );

    border:3px solid #df3aa9;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 20px rgba(255,0,180,.35),
    0 0 50px rgba(255,0,180,.2);
}

.logo span{
    color:#fff;

    font-size:36px;
    font-weight:900;
    letter-spacing:1px;

    text-shadow:
    0 0 8px #fff,
    0 0 18px rgba(255,255,255,.4);
}

/* ================= TITLE ================= */

h1{
    width:100%;

    font-size:34px;
    line-height:1.12;

    font-weight:900;

    color:#fff;

    margin-bottom:14px;

    overflow-wrap:anywhere;
}

/* ================= SUBTITLE ================= */

.subtitle{
    width:100%;

    font-size:16px;
    line-height:1.5;

    color:#c7c0ca;

    margin-bottom:38px;
}

.subtitle span{
    color:#ff40bd;
    padding:0 5px;
}

/* ================= CARDS ================= */

.stats{
    width:100%;

    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:7px;

    margin-bottom:38px;
}

.card{
    width:100%;
    min-width:0;

    height:205px;

    padding:12px 4px;

    border-radius:20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        145deg,
        rgba(255,20,180,.13),
        rgba(70,0,65,.20)
    );

    border:1px solid rgba(255,50,185,.3);

    box-shadow:
    inset 0 0 20px rgba(255,0,170,.04);
}

.icon{
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#ff4fc6;

    font-size:37px;

    margin-bottom:9px;

    text-shadow:
    0 0 10px #ff25b8,
    0 0 20px rgba(255,0,190,.5);
}

.people{
    font-size:34px;
}

.refresh{
    font-size:42px;
}

.check{
    font-size:46px;
    font-weight:bold;
}

.number{
    font-size:21px;
    font-weight:900;

    line-height:1.15;

    margin-bottom:7px;
}

.label{
    font-size:14px;
    color:#c6c0c8;
}

/* ================= TELEGRAM ================= */

.join-btn{
    width:100%;
    min-height:95px;

    padding:12px;

    border-radius:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    text-decoration:none;

    color:#fff;

    font-size:20px;
    font-weight:900;

    background:
    linear-gradient(
        105deg,
        #198cf5,
        #086be8
    );

    box-shadow:
    0 0 25px rgba(0,120,255,.5),
    0 12px 35px rgba(0,80,255,.22);

    margin-bottom:22px;
}

.telegram{
    margin-right:8px;
}

.arrow{
    margin-left:8px;
}

/* ================= OPEN TEXT ================= */

.open-text{
    width:100%;

    color:#beb8c1;

    font-size:15px;

    line-height:1.5;

    margin-bottom:35px;
}

.open-dot{
    color:#ff40bf;
}

/* ================= REDIRECT ================= */

.redirect{
    width:100%;

    min-height:82px;

    padding:14px;

    border-radius:42px;

    border:1px solid rgba(255,40,180,.3);

    background:rgba(255,255,255,.025);

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:14px;

    line-height:1.5;

    color:#c4bdc7;
}

.redirect a{
    color:#ff43c2;

    font-weight:900;

    margin-left:6px;

    text-decoration:underline;
}

/* ================= LARGER PHONES ================= */

@media(min-width:400px){

    .container{
        padding-left:20px;
        padding-right:20px;
    }

    .logo-area{
        height:340px;
    }

    .logo-area:before{
        width:320px;
        height:320px;
    }

    .logo-area:after{
        width:265px;
        height:265px;
    }

    .glow{
        width:305px;
        height:305px;
    }

    .logo{
        width:205px;
        height:205px;
    }

    .logo span{
        font-size:40px;
    }

    h1{
        font-size:38px;
    }

    .subtitle{
        font-size:18px;
    }

    .card{
        height:225px;
    }

    .number{
        font-size:24px;
    }

    .label{
        font-size:16px;
    }

    .join-btn{
        min-height:105px;
        font-size:22px;
    }
}

/* ================= TABLET / DESKTOP ================= */

@media(min-width:700px){

    .container{
        max-width:850px;
        padding:45px 30px 55px;
    }

    .logo-area{
        height:420px;
    }

    .logo-area:before{
        width:400px;
        height:400px;
    }

    .logo-area:after{
        width:335px;
        height:335px;
    }

    .glow{
        width:365px;
        height:365px;
    }

    .logo{
        width:255px;
        height:255px;
    }

    .logo span{
        font-size:50px;
    }

    h1{
        font-size:55px;
    }

    .subtitle{
        font-size:24px;
        margin-bottom:60px;
    }

    .stats{
        gap:18px;
        margin-bottom:60px;
    }

    .card{
        height:260px;
        border-radius:28px;
    }

    .icon{
        font-size:50px;
    }

    .number{
        font-size:38px;
    }

    .label{
        font-size:22px;
    }

    .join-btn{
        min-height:125px;
        font-size:34px;
        border-radius:32px;
    }

    .open-text{
        font-size:21px;
    }

    .redirect{
        min-height:100px;
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- LOGO -->

        <div class="logo-area">

            <div class="glow"></div>

            <div class="logo">
                <span>Singh</span>
            </div>

        </div>


        <!-- CHANNEL NAME -->

        <h1>
            Singh's Sure Shots
        </h1>


        <!-- SUBTITLE -->

        <div class="subtitle">

            Telugu Community

            <span>•</span>

            Premium Updates

        </div>


        <!-- CARDS -->

        <div class="stats">

            <div class="card">

                <div class="icon people">
                    ♙♙
                </div>

                <div class="number">
                    3.1K+
                </div>

                <div class="label">
                    Members
                </div>

            </div>


            <div class="card">

                <div class="icon refresh">
                    ↻
                </div>

                <div class="number">
                    Daily
                </div>

                <div class="label">
                    Updates
                </div>

            </div>


            <div class="card">

                <div class="icon check">
                    ✓
                </div>

                <div class="number">
                    100%
                </div>

                <div class="label">
                    Free
                </div>

            </div>

        </div>


        <!-- TELEGRAM BUTTON -->

        <a
            href="https://t.me/+HTC_o2ezEqdkNjM1"
            target="_blank"
            rel="noopener noreferrer"
            class="join-btn"
        >

            <span class="telegram">
                ➤
            </span>

            Join free on Telegram

            <span class="arrow">
                →
            </span>

        </a>


        <!-- OPEN TEXT -->

        <div class="open-text">

            <span class="open-dot">●</span>

            &nbsp;

            Opens Telegram in a new tab

        </div>


        <!-- REDIRECT -->

        <div class="redirect">

            Redirecting you to Telegram...

            <a
                href="https://t.me/+HTC_o2ezEqdkNjM1"
                target="_blank"
                rel="noopener noreferrer"
            >
                Go now
            </a>

        </div>

    </div>

</div>

</body>
    </html>
