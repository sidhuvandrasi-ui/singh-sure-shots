<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Singh Sure Shots</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

/* BACKGROUND GLOW */

body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    top:-220px;
    left:-180px;
    background:radial-gradient(
        circle,
        rgba(0,255,170,.18),
        transparent 70%
    );
    filter:blur(25px);
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    bottom:-250px;
    right:-180px;
    background:radial-gradient(
        circle,
        rgba(0,170,255,.15),
        transparent 70%
    );
    filter:blur(25px);
    pointer-events:none;
}


/* CONTAINER */

.container{
    width:100%;
    max-width:500px;
    padding:35px 20px;
    text-align:center;
    position:relative;
    z-index:2;
}


/* LOGO */

.logo-circle{
    width:92px;
    height:92px;
    margin:0 auto 22px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        145deg,
        #111,
        #050505
    );

    border:1px solid rgba(0,255,170,.45);

    box-shadow:
        0 0 18px rgba(0,255,170,.30),
        0 0 45px rgba(0,255,170,.12),
        inset 0 0 20px rgba(0,255,170,.08);
}


.logo-text{
    font-size:22px;
    font-weight:900;
    color:#00ffae;

    text-shadow:
        0 0 10px rgba(0,255,170,.65),
        0 0 25px rgba(0,255,170,.25);
}


/* NAME */

h1{
    font-size:38px;
    font-weight:900;
    letter-spacing:-1px;
    margin-bottom:12px;

    text-shadow:
        0 0 20px rgba(255,255,255,.08);
}


h1 span{
    color:#00ffae;
}


/* SUBTITLE */

.subtitle{
    color:#a6aaa8;
    font-size:15px;
    line-height:1.6;
    margin-bottom:27px;
}

.dot{
    color:#00ffae;
    padding:0 5px;
}


/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;

    margin-bottom:22px;
}


.stat{
    min-height:118px;

    padding:16px 8px;

    border-radius:18px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 12px 35px rgba(0,0,0,.30),
        inset 0 1px rgba(255,255,255,.05);

    transition:.3s ease;
}


.stat:hover{
    transform:translateY(-3px);

    border-color:rgba(0,255,170,.30);

    box-shadow:
        0 12px 35px rgba(0,255,170,.08);
}


/* ICON */

.icon{
    font-size:21px;
    color:#00ffae;
    margin-bottom:8px;

    text-shadow:
        0 0 12px rgba(0,255,170,.55);
}


/* NUMBER */

.stat-number{
    font-size:21px;
    font-weight:900;
    margin-bottom:5px;
}


/* LABEL */

.stat-label{
    font-size:12px;
    color:#7f8582;
}


/* TELEGRAM BUTTON */

.join-btn{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    width:100%;

    min-height:65px;

    padding:16px 20px;

    border-radius:17px;

    text-decoration:none;

    color:#00140d;

    background:linear-gradient(
        135deg,
        #00ffae,
        #00d99a
    );

    font-size:18px;
    font-weight:900;

    box-shadow:
        0 0 20px rgba(0,255,174,.25),
        0 12px 35px rgba(0,255,174,.12);

    overflow:hidden;

    transition:.25s ease;
}


.join-btn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:rgba(255,255,255,.30);

    transform:skewX(-25deg);

    animation:shine 3s infinite;
}


@keyframes shine{

    0%{
        left:-100%;
    }

    45%,100%{
        left:140%;
    }

}


.join-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(0,255,174,.38),
        0 15px 45px rgba(0,255,174,.15);
}


.join-btn:active{
    transform:scale(.98);
}


/* NOTE */

.telegram-note{
    margin-top:12px;

    font-size:13px;

    color:#777d7a;
}


.telegram-dot{
    color:#00ffae;

    text-shadow:
        0 0 10px rgba(0,255,170,.60);
}


/* REDIRECT */

.redirect-box{
    margin-top:20px;

    padding:15px;

    border-radius:15px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.07);

    color:#777d7a;

    font-size:13px;
}


.redirect-box strong{
    color:#fff;
}


.redirect-box a{
    color:#00ffae;

    font-weight:bold;

    text-decoration:none;

    margin-left:5px;
}


.redirect-box a:hover{
    text-decoration:underline;
}


/* MOBILE */

@media(max-width:380px){

    .container{
        padding:28px 15px;
    }

    h1{
        font-size:32px;
    }

    .subtitle{
        font-size:14px;
    }

    .stat{
        min-height:110px;
    }

    .stat-number{
        font-size:19px;
    }

    .stat-label{
        font-size:11px;
    }

    .join-btn{
        min-height:67px;
        font-size:18px;
    }

    .telegram-note{
        font-size:14px;
    }

    .redirect-box{
        font-size:14px;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- LOGO -->

    <div class="logo-circle">

        <div class="logo-text">
            SINGH
        </div>

    </div>


    <!-- NAME -->

    <h1>
        SINGH <span>SURE SHOTS</span>
    </h1>


    <!-- SUBTITLE -->

    <div class="subtitle">
        Premium Signals
        <span class="dot">•</span>
        Community Channel
    </div>


    <!-- STATS -->

    <div class="stats">


        <div class="stat">

            <div class="icon">
                ◉
            </div>

            <div class="stat-number">
                3.1K+
            </div>

            <div class="stat-label">
                Members
            </div>

        </div>


        <div class="stat">

            <div class="icon">
                ↻
            </div>

            <div class="stat-number">
                Daily
            </div>

            <div class="stat-label">
                Updates
            </div>

        </div>


        <div class="stat">

            <div class="icon">
                ✓
            </div>

            <div class="stat-number">
                100%
            </div>

            <div class="stat-label">
                Free
            </div>

        </div>


    </div>


    <!-- TELEGRAM BUTTON -->

    <a
        class="join-btn"
        href="https://t.me/+HTC_o2ezEqdkNjM1"
        target="_blank"
        rel="noopener noreferrer"
    >

        Join free on Telegram →

    </a>


    <!-- NOTE -->

    <div class="telegram-note">

        <span class="telegram-dot">●</span>

        Opens Telegram in a new tab

    </div>


    <!-- REDIRECT -->

    <div class="redirect-box">

        Redirecting you to Telegram in
        <strong id="count">0s</strong>...

        <a
            href="https://t.me/+HTC_o2ezEqdkNjM1"
            target="_blank"
            rel="noopener noreferrer"
        >
            Go now
        </a>

    </div>


</div>


<script>

/* Redirect countdown */

let seconds = 0;

const count = document.getElementById("count");

count.textContent = seconds + "s";


/* Telegram button tracking */

document.querySelector(".join-btn").addEventListener(
    "click",
    function(){

        if(typeof fbq === "function"){

            fbq(
                "track",
                "Subscribe"
            );

        }

    }
);

</script>


</body>
    </html>
