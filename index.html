<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Singh's Sure Shots</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 50% 18%, rgba(190, 0, 255, 0.20), transparent 28%),
        radial-gradient(circle at 10% 85%, rgba(255, 0, 150, 0.12), transparent 30%),
        #08070d;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      padding: 42px 20px 35px;
      text-align: center;
    }

    /* LOGO */

    .logo {
      width: 108px;
      height: 108px;
      margin: 0 auto 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 35% 30%, #ff4fc3, #b000ff 45%, #46005f 100%);

      border: 3px solid #ff43c7;

      box-shadow:
        0 0 15px #ff24c4,
        0 0 35px rgba(255, 0, 190, 0.65),
        inset 0 0 25px rgba(255,255,255,0.12);

      animation: glow 2.5s infinite alternate;
    }

    .logo span {
      font-size: 38px;
      font-weight: 1000;
      letter-spacing: 2px;
      color: #fff;

      text-shadow:
        0 0 8px #fff,
        0 0 18px #ff31c8,
        0 0 30px #ff00bb;
    }

    @keyframes glow {
      from {
        transform: scale(1);
        box-shadow:
          0 0 15px #ff24c4,
          0 0 30px rgba(255, 0, 190, 0.5);
      }

      to {
        transform: scale(1.04);
        box-shadow:
          0 0 20px #ff24c4,
          0 0 50px rgba(255, 0, 190, 0.75);
      }
    }

    /* TITLE */

    h1 {
      font-size: 32px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 12px;

      background: linear-gradient(
        90deg,
        #ff75db,
        #ffffff,
        #e875ff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow: 0 0 20px rgba(255, 0, 200, 0.25);
    }

    .subtitle {
      font-size: 15px;
      color: #aaa5b2;
      margin-bottom: 30px;
    }

    /* INFO CARDS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }

    .card {
      min-height: 88px;
      padding: 16px 8px;

      border: 1px solid rgba(255, 52, 202, 0.28);
      border-radius: 14px;

      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(12px);

      box-shadow:
        inset 0 1px rgba(255,255,255,0.05),
        0 8px 25px rgba(0,0,0,0.25);
    }

    .number {
      display: block;
      font-size: 21px;
      font-weight: 900;
      color: #ff50d1;
      margin-bottom: 7px;

      text-shadow: 0 0 12px rgba(255, 0, 190, 0.55);
    }

    .label {
      display: block;
      font-size: 11px;
      color: #a8a3ae;
      line-height: 1.25;
    }

    /* JOIN BUTTON */

    .join-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      min-height: 58px;

      border-radius: 14px;

      text-decoration: none;
      color: white;

      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.2px;

      background: linear-gradient(
        135deg,
        #ff39c8,
        #a600ff
      );

      border: 1px solid rgba(255,255,255,0.18);

      box-shadow:
        0 0 15px rgba(255, 0, 200, 0.45),
        0 12px 30px rgba(110, 0, 130, 0.35);

      transition: 0.25s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 25px rgba(255, 0, 200, 0.7),
        0 15px 35px rgba(110, 0, 130, 0.45);
    }

    .telegram-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: white;
      color: #a600ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      font-weight: 900;
    }

    .arrow {
      font-size: 21px;
      margin-left: 2px;
    }

    /* BOTTOM TEXT */

    .safe-text {
      margin-top: 15px;
      font-size: 12px;
      color: #77727d;
    }

    .bottom-line {
      margin-top: 38px;
      font-size: 12px;
      color: #5f5a65;
    }

    /* MOBILE */

    @media (max-width: 360px) {
      .container {
        padding-left: 15px;
        padding-right: 15px;
      }

      h1 {
        font-size: 28px;
      }

      .card {
        padding-left: 5px;
        padding-right: 5px;
      }

      .number {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- SSH LOGO -->
    <div class="logo">
      <span>SSH</span>
    </div>

    <!-- CHANNEL NAME -->
    <h1>Singh's Sure Shots</h1>

    <p class="subtitle">
      Telugu Community • Premium Updates
    </p>

    <!-- STATS -->
    <section class="stats">

      <div class="card">
        <span class="number">3.1K+</span>
        <span class="label">Members</span>
      </div>

      <div class="card">
        <span class="number">Daily</span>
        <span class="label">Updates</span>
      </div>

      <div class="card">
        <span class="number">100%</span>
        <span class="label">Free</span>
      </div>

    </section>

    <!-- TELEGRAM BUTTON -->
    <a
      class="join-btn"
      href="https://t.me/+HTC_o2ezEqdkNjM1"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram-icon">➤</span>
      Join free on Telegram
      <span class="arrow">→</span>
    </a>

    <p class="safe-text">
      Tap the button above to join our Telegram community
    </p>

    <p class="bottom-line">
      Singh's Sure Shots • Premium Community
    </p>

  </main>

</body>
    </html>
